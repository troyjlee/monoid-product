name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build the library and axiom checks
        uses: leanprover/lean-action@v1
      - name: Build MonoidProduct and MonoidProductChecks explicitly
        run: lake build MonoidProduct MonoidProductChecks
      - name: Check Lean sources for unpublished imports
        run: python3 scripts/export-monoid.py --check-only
